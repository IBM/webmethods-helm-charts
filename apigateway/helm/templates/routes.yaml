{{- if .Values.routes.ui.enabled }}
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: {{- if .Values.routes.ui.name }} {{ .Values.routes.ui.name }} {{ else }} {{ include "common.names.fullname" . }}-ui{{- end }}
  labels: {{ .Values.routes.ui.labels }}
  annotations:
    {{- range $key, $value := .Values.routes.ui.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  host: {{ .Values.routes.ui.hostName }}
  port:
    targetPort: {{ .Values.routes.ui.portName }} 
  to:
    kind: Service
    name: {{ include "common.names.fullname" . }}-ui
  {{- range $key, $value := .Values.routes.ui.extras }}
  {{- if kindIs "map" $value -}}
    {{ printf "\n" }}{{ $key | indent 4 }}:
    {{- range $key, $value := $value -}}
      {{ printf "\n" }}{{ $key | indent 6 }}: {{ $value}}
    {{- end }}
  {{- else -}}
    {{ printf "\n" }}{{ $key | indent 4 }}: {{ $value }}
  {{- end -}}
  {{- end }}
{{- end }}


