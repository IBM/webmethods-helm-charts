apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}-rt
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .Values.extraLabels -}}
    {{ toYaml . | nindent 4 }}
    {{- end }}
    service-name: {{ include "common.names.fullname" . }}-rt
  annotations:
    {{- with .Values.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.runtimeService.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ int .Values.apigw.runtimePort }}
    protocol: TCP
    targetPort: {{ int .Values.apigw.runtimePort }}
    name: rtport
    {{- if (eq .Values.service.type "ClusterIP") }}
    nodePort: null
    {{- end }}
  selector:
    {{- include "common.labels.matchLabels" . | nindent 4}}
{{- if .Values.apigw.adminPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}-admin
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .Values.extraLabels -}}
    {{ toYaml . | nindent 4 }}
    {{- end }}
    service-name: {{ include "common.names.fullname" . }}-admin
  annotations:
    {{- with .Values.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.adminService.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ int .Values.apigw.adminPort }}
    protocol: TCP
    targetPort: {{ int .Values.apigw.adminPort }}
    name: adminport
    {{- if (eq .Values.service.type "ClusterIP") }}
    nodePort: null
    {{- end }}
  selector:
    {{- include "common.labels.matchLabels" . | nindent 4}}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}-ui
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .Values.extraLabels -}}
    {{ toYaml . | nindent 4 }}
    {{- end }}
    service-name: {{ include "common.names.fullname" . }}-ui
  annotations:
    {{- with .Values.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.uiService.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 1000
  ports:
  - port: {{ int .Values.apigw.uiPort }}
    protocol: TCP
    targetPort: {{ int .Values.apigw.uiPort }}
    name: uiport
    {{- if (eq .Values.service.type "ClusterIP") }}
    nodePort: null
    {{- end }}
  selector:
    {{- include "common.labels.matchLabels" . | nindent 4}}
{{- if .Values.grpcService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}-grpc
  annotations:
    {{- with .Values.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.grpcService.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.grpcService.azureInternalLoadBalancer }}
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    {{- end }}
    {{- if .Values.grpcService.dnsExternal }}
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.grpcService.hostname }}
    {{- end }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .Values.extraLabels -}}
    {{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.grpcService.type }}
  ports:
  - port: {{ int .Values.apigw.grpcPort }}
    protocol: TCP
    targetPort: {{ int .Values.apigw.grpcPort }}
    name: grpcport
    {{- if (eq .Values.grpcService.type "ClusterIP") }}
    nodePort: null
    {{- end }}
  selector:
    {{- include "common.labels.matchLabels" . | nindent 4}}
{{- end }}

{{- if .Values.externalService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}-external
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .Values.extraLabels -}}
    {{ toYaml . | nindent 4 }}
    {{- end }}
    service-name: {{ include "common.names.fullname" . }}-external
  annotations:
    {{- with .Values.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.externalService.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 1000
  ports:
  - port: {{ int .Values.apigw.runtimeExternalPort }}
    protocol: TCP
    targetPort: {{ int .Values.apigw.runtimeExternalPort }}
    name: externalport
    {{- if (eq .Values.service.type "ClusterIP") }}
    nodePort: null
    {{- end }}
  selector:
    {{- include "common.labels.matchLabels" . | nindent 4}}
{{- end }}
---
{{ with .Values.external }}
apiVersion: v1
kind: Service
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ include "common.names.fullname" $ }}-nodeport{{ .k8sDomain }}
  name: {{ include "common.names.fullname" $ }}-nodeport
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    {{- with $.Values.extraLabels -}}
    {{ toYaml . | nindent 4 }}
    {{- end }}
    service-name: {{ include "common.names.fullname" $ }}-nodeport
  annotations:
    {{- with .Values.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: NodePort
  ports:
    - name: http-nodeport
      protocol: TCP
      port: {{ .ports.registration }}
      targetPort: {{ .ports.registration }}
      nodePort: {{ .ports.node }}
  externalTrafficPolicy: {{ default "Cluster" .externalTrafficPolicy }}
  selector:
    {{- include "common.labels.matchLabels" $ | nindent 4}}
{{- end }}