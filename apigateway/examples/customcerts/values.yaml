

# Example values file for importing custom certificates into API Gateway truststore
# This example provides a complete init container configuration with inline certificate import script

image:
  tag: "11.1"
  repository: ibmwebmethods.azurecr.io/apigateway-minimal

appVersion: "11.1"

apigw:
  isHomeDir: /opt/softwareag/IntegrationServer

# License Key is not required for 11.x
skipLicenseKey: true

# Skip Kibana Autostart Parameter for minimal 11.x container images
skipKibanaAutostartParameter: true

elasticsearch:
  version: "8.17.3"

kibana:
  version: "8.17.3"

# Define init containers
# Note: The helper function apigateway.importCertScript is available in _helper.tpl
# but cannot be used directly in values.yaml due to Helm's values file parsing limitations.
# The script below is equivalent to calling the helper function with these parameters:
#   sourceKeystore: /opt/softwareag/jvm/jvm/jre/lib/security/cacerts (from API Gateway image)
#   targetDir: /mnt/prepared
#   keystorePassword: changeit (default Java cacerts password)
#   certFile: /mnt/certs/custom-ca.crt
#   certAlias: example-custom-ca
#   keytoolPath: /opt/softwareag/jvm/jvm/bin/keytool
extraInitContainers:
  - name: import-custom-certs
    image: ibmwebmethods.azurecr.io/apigateway-minimal:11.1.0.11
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh", "-c"]
    args:
      - |
        #!/bin/sh
        set -e
        echo "Starting certificate import process..."
        mkdir -p "/mnt/prepared"
        
        # Use cacerts from the API Gateway image as source truststore
        SOURCE_KEYSTORE="/opt/softwareag/jvm/jvm/lib/security/cacerts"
        TARGET_KEYSTORE="/mnt/prepared/cacerts"
        
        if [ ! -f "${SOURCE_KEYSTORE}" ]; then
          echo "ERROR: Source keystore not found: ${SOURCE_KEYSTORE}"
          exit 1
        fi
        
        echo "Copying cacerts from ${SOURCE_KEYSTORE} to ${TARGET_KEYSTORE}"
        cp "${SOURCE_KEYSTORE}" "${TARGET_KEYSTORE}"
        
        echo "Validating source keystore format..."
        if ! /opt/softwareag/jvm/jvm/bin/keytool -list -storetype JKS -keystore "${TARGET_KEYSTORE}" -storepass "changeit" > /dev/null 2>&1; then
          echo "ERROR: Source keystore is not a valid JKS keystore or password is incorrect"
          echo "Please ensure the source truststore is a valid JKS file and the password is correct"
          exit 1
        fi
        echo "Source keystore validated successfully"
        
        CERT_FILE="/mnt/certs/custom-ca.crt"
        if [ ! -f "${CERT_FILE}" ]; then
          echo "ERROR: Certificate file not found: ${CERT_FILE}"
          exit 1
        fi
        
        echo "Importing certificate from ${CERT_FILE} with alias 'example-custom-ca'"
        /opt/softwareag/jvm/jvm/bin/keytool -import \
          -noprompt \
          -storetype JKS \
          -keystore "${TARGET_KEYSTORE}" \
          -storepass "changeit" \
          -file "${CERT_FILE}" \
          -alias "example-custom-ca" \
          -trustcacerts
        
        echo "Verifying certificate import..."
        if /opt/softwareag/jvm/jvm/bin/keytool -list -storetype JKS -keystore "${TARGET_KEYSTORE}" -storepass "changeit" -alias "example-custom-ca" > /dev/null 2>&1; then
          echo "SUCCESS: Certificate 'example-custom-ca' imported successfully"
        else
          echo "ERROR: Failed to verify certificate import"
          exit 1
        fi
        
        echo "Certificate import process completed successfully"
    volumeMounts:
      - name: custom-certs
        mountPath: /mnt/certs
        readOnly: true
      - name: prepared-truststore
        mountPath: /mnt/prepared

# Mount the prepared truststore in the main container
extraVolumeMounts:
  - name: prepared-truststore
    mountPath: /mnt/prepared
    readOnly: false

# Configure JVM to use the custom truststore from /mnt/prepared
extraEnvs:
  # Set the truststore location for the JVM
  - name: JAVA_OPTS
    value: "-Djavax.net.ssl.trustStore=/mnt/prepared/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=JKS"

# Define the volumes
extraVolumes:
  # Custom certificates from configmap
  - name: custom-certs
    configMap:
      name: apigw-custom-certs
  # Shared emptyDir for prepared truststore
  - name: prepared-truststore
    emptyDir: {}

