apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    {{- with $.Values.extraLabels }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
{{- if .binaryData }}
binaryData:
  {{- range $key, $val := .binaryData }}
  {{ $key }}: {{ $val | b64enc }}
  {{- end }}
{{- else if .b64EncData }}
binaryData:
  {{ .name }}: >-
    {{ .b64EncData }}
{{- else }}
data:
  {{- range $key, $val := .data }}
  {{ $key }}: |-
    {{- if kindIs "string" $val }}
{{ tpl $val $ | indent 4 }}
    {{- else }}
{{ toYaml $val | indent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
